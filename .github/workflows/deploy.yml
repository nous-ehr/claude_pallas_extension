name: Build & Deploy MCP Server to Azure

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger from GitHub UI

env:
  AZURE_WEBAPP_NAME: pallas-mcp-server
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build MCP server
        run: pnpm build

      - name: Prepare deployment package
        run: |
          rm -rf deploy
          mkdir -p deploy/data
          cp packages/mcp-server/dist/server.cjs deploy/
          cp data/kb.json deploy/data/
          echo '{"name":"pallas-mcp-server","version":"0.1.0","private":true,"scripts":{"start":"node server.cjs"}}' > deploy/package.json

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy

      - name: Restart App Service
        run: |
          # Extract credentials from publish profile and call restart API
          PUBLISH_PROFILE='${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}'
          USERNAME=$(echo "$PUBLISH_PROFILE" | grep -oP 'userName="\K[^"]+' | head -1)
          PASSWORD=$(echo "$PUBLISH_PROFILE" | grep -oP 'userPWD="\K[^"]+' | head -1)
          curl -s -X POST "https://${{ env.AZURE_WEBAPP_NAME }}.scm.azurewebsites.net/api/restart" \
            -u "$USERNAME:$PASSWORD" \
            --max-time 30 || echo "Restart request sent"
          echo "Waiting for app to restart..."
          sleep 15
          curl -s --max-time 30 "https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health" || echo "Health check pending"
